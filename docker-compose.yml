services:
  backend:
    build: .
    container_name: vibrain-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo
    volumes:
      - .:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - MONGODB_URI=mongodb://mongo:27017/vibrain
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}

  redis:
    image: redis:7.4
    container_name: vibrain-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        if [ -n "$${REDIS_PASSWORD}" ];
        then exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}";
        else exec redis-server /usr/local/etc/redis/redis.conf;
        fi
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:7.0
    container_name: vibrain-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vibrain

volumes:
  redis-data:
  mongo-data:
