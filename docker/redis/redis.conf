# Redis configuration for local development.

bind 0.0.0.0
protected-mode no
port 6379

# Enable persistence so cache survives container restarts during dev.
appendonly yes
appendfsync everysec

# Default database index (FastAPI app uses 0 by default).
databases 16

# Logging
loglevel notice

# Save snapshots if X writes happened within Y seconds.
save 900 1
save 300 10
save 60 10000

